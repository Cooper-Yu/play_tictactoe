# SI units: meters, radians and seconds. Runtime command parameters remain writable.
motion_planner:
  ros__parameters:
    joint_states_topic: /joint_states
    move_action_name: /move_action
    execute_action_name: /execute_trajectory
    stop_event_topic: /trajectory_execution_event
    planning_group: arm
    planning_time: 5.0
    planning_attempts: 1
    position_tolerance: 0.0001
    orientation_tolerance: 0.01
    joint_goal_tolerance: 0.0001
    action_server_timeout: 5.0
    feedback_max_age: 1.0
    execution_start_tolerance: 0.01
    settle_timeout: 5.0
    stop_timeout: 5.0
    settle_period: 0.1
    settle_joint_tolerance: 0.0001
    settle_samples: 3
    recording_timeout: 5.0
    return_joint_tolerance: 0.001
    return_position_tolerance: 0.0003
    return_orientation_tolerance: 0.003
    state_log_period: 1.0
    axis: x
    distance: 0.0
    velocity_scaling: 0.1
    acceleration_scaling: 0.1
    record_name: A
    overwrite: false
    cartesian_service: /compute_cartesian_path
    cartesian_step: 0.001
    cartesian_timeout: 15.0
    cartesian_joint_jump: 0.15
    cartesian_max_length: 0.3
    cartesian_speed: 0.005
    cartesian_path_tolerance: 0.0005
    cartesian_orientation_tolerance: 0.003
    dx: 0.0
    dy: 0.0
